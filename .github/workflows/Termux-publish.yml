name: Build Termux Wheel and Upload to Release

on:
  release:
    types: [published]
  workflow_dispatch:

# Define a reusable set of steps for checking out code and building the frontend
x-frontend-build-steps: &frontend-build-steps
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      submodules: 'recursive' # Ensure all nested submodules are pulled
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 'lts/*' # Use the latest LTS version
      cache: 'npm' # Cache npm dependencies to speed up build
  - name: Build frontend
    run: |
      npm install
      npm run build

jobs:
  build-termux:
    name: Build Termux wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to upload release assets
    steps:
      - <<: *frontend-build-steps

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install dependencies and Android target
        run: |
          pip install maturin
          rustup target add aarch64-linux-android

      - name: Set up CPython interpreter for cross-compilation
        run: |
          BASE_URL="https://packages.termux.dev/apt/termux-main/pool/main/p/python"
          FNAME=$(curl -s "$BASE_URL/" | grep -oE 'python_[0-9]+\.[0-9]+\.[0-9]+_aarch64\.deb' | head -n 1)
          wget -nv "$BASE_URL/$FNAME"
          mkdir python
          dpkg-deb -x "$FNAME" python
          cp -a python/data/data/com.termux/files/usr/lib/libpython* $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/24
          # Temporarily modify files for Termux build
          sed -i 's/pyo3 = { version = "0.24.0", features = \[.*\] }/pyo3 = { version = "0.24.0" }/' crates/stream-gears/Cargo.toml
          sed -i '/\[project.dependencies\]/a "quickjs >= 1.19.4",' pyproject.toml

      - name: Build wheel for aarch64 (Termux)
        uses: PyO3/maturin-action@v1
        env:
          PYO3_CROSS_LIB_DIR: python/data/data/com.termux/files/usr/lib/
        with:
          target: aarch64-linux-android
          args: --release --strip --out dist --manylinux off

      - name: Upload wheel to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
